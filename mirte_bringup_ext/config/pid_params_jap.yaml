/pid_wheels_controller:
  ros__parameters:
    command_interface: velocity
    dof_names:
    - front_left_wheel_joint
    - rear_left_wheel_joint
    - rear_right_wheel_joint
    - front_right_wheel_joint
    gains:
      front_left_wheel_joint:
        angle_wraparound: false
        antiwindup: true
        d: 0.01
        feedforward_gain: 0.0
        i: 0.5
        i_clamp_max: 15.0
        i_clamp_min: -15.0
        p: 2.0
      front_right_wheel_joint:
        angle_wraparound: false
        antiwindup: true
        d: 0.01
        feedforward_gain: 0.0
        i: 0.5
        i_clamp_max: 15.0
        i_clamp_min: -15.0
        p: 2.0
      rear_left_wheel_joint:
        angle_wraparound: false
        antiwindup: true
        d: 0.01
        feedforward_gain: 0.0
        i: 0.5
        i_clamp_max: 15.0
        i_clamp_min: -15.0
        p: 2.0
      rear_right_wheel_joint:
        angle_wraparound: false
        antiwindup: true
        d: 0.01
        feedforward_gain: 0.0
        i: 0.5
        i_clamp_max: 15.0
        i_clamp_min: -15.0
        p: 2.0
    reference_and_state_dof_names: []
    reference_and_state_interfaces:
    - velocity
    update_rate: 0
    use_external_measured_states: false
    use_sim_time: false

